spring.application.name=exhelpdesk

# Server
server.port=8080

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/exhelpdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:exhelpdesk-super-secret-key-change-in-production-min-256bit}
jwt.expiration=${JWT_EXPIRATION:28800000}

# AWS S3 / LocalStack
aws.endpoint=${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
aws.region=${AWS_REGION:us-east-1}
aws.accessKey=${AWS_ACCESS_KEY_ID:test}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:test}
aws.bucketName=${AWS_BUCKET_NAME:exhelpdesk-files}
aws.presigned-url-expiration-seconds=${AWS_PRESIGNED_URL_EXPIRATION_SECONDS:3600}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.exprivia=DEBUG
logging.level.org.springframework.security=DEBUG
